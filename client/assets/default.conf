# Initial PS4 settings; copied to /data/luanti/minetest.conf on first launch.
maintab_LAST = play_online
video_driver = opengl3
fullscreen = true
screen_w = 1920
screen_h = 1080
autosave_screensize = false
vsync = true
fps_max = 60
enable_sound = true
sound_volume = 0.6
viewing_range = 50
# Luanti 5.17's OpenGL3 driver always uses shaders.
enable_dynamic_shadows = false
enable_post_processing = false
enable_3d_clouds = false
menu_clouds = false
enable_ipv6 = false
curl_verify_cert = true
name = PS4Player
